<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台管理 · 本地工具台</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/static/portal.css"><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/platforms.css"><script src="/static/account-window.js" defer></script><script src="/static/workspace.js" defer></script><script src="/static/platforms.js" defer></script></head>
<body class="workspace-app" data-workspace="platforms"><main class="portal-shell platforms-shell">
  <header class="platforms-heading"><div><h1>平台管理</h1><p>管理活动入口与运行状态，短期活动结束后自动停止。</p></div><button type="button" class="secondary" id="platforms-refresh">刷新</button></header>
  <p id="platforms-feedback" class="platforms-feedback" role="status" hidden></p>
  <section class="platforms-panel" aria-label="活动管理">
    <div class="platforms-panel-heading"><h2>活动平台 <span id="platforms-count">0</span></h2><p>移除活动不会影响共享账号及其他功能。</p></div>
    <div class="platforms-table-wrap"><table class="platforms-table"><thead><tr><th scope="col">活动名称</th><th scope="col">类型</th><th scope="col">运行状态</th><th scope="col">结束时间 · 北京时间</th><th scope="col">操作</th></tr></thead><tbody id="platforms-rows"><tr><td colspan="5" class="platforms-empty">正在读取活动…</td></tr></tbody></table></div>
  </section>
  <p class="platforms-note">活动到期后会停止后台任务并隐藏功能入口，活动记录保留供查阅。需要彻底清理时，可永久移除该活动。</p>
</main>
<dialog id="platforms-delete-dialog" aria-labelledby="platforms-delete-title"><form id="platforms-delete-form">
  <div class="platforms-dialog-heading"><h2 id="platforms-delete-title">永久移除活动</h2><button type="button" class="quiet close" id="platforms-delete-close" aria-label="关闭移除确认">×</button></div>
  <p id="platforms-delete-name" class="platforms-delete-name"></p>
  <p class="platforms-delete-warning">此操作会停止该活动的全部任务，清空活动数据并移除活动模块。移除后无法恢复。共享账号及其他功能不受影响。</p>
  <label for="platforms-confirmation">请输入 <strong id="platforms-delete-id"></strong> 确认移除</label><input id="platforms-confirmation" autocomplete="off" spellcheck="false" required>
  <p id="platforms-delete-error" class="platforms-delete-error" role="alert" hidden></p>
  <div class="platforms-dialog-actions"><button type="button" class="secondary" id="platforms-delete-cancel">取消</button><button type="submit" class="platforms-danger" id="platforms-delete-submit" disabled>永久移除</button></div>
</form></dialog>
</body></html>
