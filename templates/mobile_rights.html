<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移动权益 · 本地工具台</title>
<link rel="stylesheet" href="/static/portal.css"><link rel="stylesheet" href="/static/workspace.css"><link rel="stylesheet" href="/static/mobile-rights.css"><link rel="stylesheet" href="/static/mobile.css?v=mobile-1">
<script src="/static/account-window.js" defer></script><script src="/static/workspace.js" defer></script><script src="/static/mobile-rights.js" defer></script><script src="/static/mobile.js?v=mobile-1" defer></script>
</head><body class="workspace-app" data-workspace="mobile-rights"><main class="portal-shell rights-shell">
<section class="rights-heading"><div><h1>移动权益</h1><p>查询本月权益、新青年兑换券和 AI 豆，使用共享账号即可连接。</p></div><button id="rights-refresh" class="secondary" type="button">刷新当前账号</button></section>
<section class="rights-panel rights-account-panel"><div class="rights-panel-heading"><h2>共享账号 <span id="rights-account-count" class="rights-count">—</span></h2><span>与其他功能共用账号</span></div><div id="rights-accounts" class="rights-accounts" role="group" aria-label="移动权益账号"></div><p id="rights-account-error" class="rights-error" role="status" hidden></p></section>
<section class="rights-panel"><div class="rights-panel-heading"><div><h2>本月权益 <span id="rights-item-count" class="rights-count">—</span></h2><p id="rights-owner">选择账号后查询</p></div><div class="rights-actions"><button id="rights-query" class="secondary" type="button">查询权益</button><button id="rights-claim-all" class="primary" type="button" disabled>领取全部待领权益</button><button id="rights-stop" class="secondary" type="button" hidden>停止后续领取</button></div></div>
<div class="rights-filters"><input id="rights-search" type="search" placeholder="搜索权益名称或状态" aria-label="搜索权益"><label><input id="rights-pending-only" type="checkbox">仅看待领取</label><label><input id="rights-tracked-only" type="checkbox">仅看已记录</label></div>
<p id="rights-message" class="rights-message" role="status" hidden></p><div class="rights-table-wrap"><table class="rights-table" aria-label="本月移动权益"><thead><tr><th>权益名称</th><th>订单时间 · 北京时间</th><th>订单号</th><th>领取状态</th><th>备注</th><th>操作</th></tr></thead><tbody id="rights-rows"><tr><td colspan="6" class="rights-empty">正在读取共享账号…</td></tr></tbody></table></div>
<div class="rights-track-form"><label for="rights-track-name">记录要关注的权益</label><div><input id="rights-track-name" placeholder="权益名称，例如：支付宝立减金" maxlength="512"><button id="rights-track-add" class="secondary" type="button">添加记录</button></div><small>完整查询后会标明已记录权益本月是否发放。</small></div>
</section>
<div class="rights-extras">
<section class="rights-panel" aria-labelledby="rights-youth-title"><div class="rights-panel-heading"><div><h2 id="rights-youth-title">新青年瑞幸</h2><p>选择一张兑换券，获取活动验证码后领取。</p></div><button id="rights-youth-query" class="secondary" type="button">查询兑换券</button></div><div class="rights-extra-body"><p id="rights-youth-message" class="rights-message" role="status" hidden></p><label class="rights-field" for="rights-youth-coupon">本账号可用兑换券</label><select id="rights-youth-coupon" disabled><option value="">查询后选择兑换券</option></select><div class="rights-code-row"><input id="rights-youth-code" placeholder="6位活动验证码" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button id="rights-youth-sms" class="secondary" type="button" disabled>获取验证码</button></div><button id="rights-youth-claim" class="primary" type="button" disabled>领取瑞幸</button></div></section>
<section class="rights-panel" aria-labelledby="rights-points-title"><div class="rights-panel-heading"><div><h2 id="rights-points-title">AI 豆</h2><p>查询可领数量，领取后核对最新余额。</p></div><button id="rights-points-query" class="secondary" type="button">查询 AI 豆</button></div><div class="rights-extra-body"><p id="rights-points-message" class="rights-message" role="status" hidden></p><dl class="rights-points-summary"><div><dt>待领取</dt><dd id="rights-points-pending">—</dd></div><div><dt>本次领取</dt><dd id="rights-points-claimed">—</dd></div><div><dt>当前总数</dt><dd id="rights-points-balance">—</dd></div></dl><button id="rights-points-claim" class="primary" type="button" disabled>领取 AI 豆</button></div></section>
</div><p class="rights-footnote">权益领取以官方返回结果为准。活动验证码只用于所选账号的新青年兑换，不会重复登录 APP。</p>
</main></body></html>
