plugins { id 'com.android.application'; id 'com.chaquo.python' }
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.caoccao.javet:javet-android:3.0.4'
    implementation 'org.opencv:opencv:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
android {
    namespace 'cn.pppyl.lingxiworkspace'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.pppyl.lingxiworkspace'
        minSdk 24
        targetSdk 35
        versionCode 2204
        versionName '2.2.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('LINGXI_KEYSTORE') ?: '../../.local/android-release.keystore')
            storePassword System.getenv('LINGXI_KEYSTORE_PASSWORD')
            keyAlias 'lingxi'
            keyPassword System.getenv('LINGXI_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.smoke' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        extractPackages('activities', 'workspace.accounts', 'features.mobile_rights')
        buildPython(System.getenv('LINGXI_BUILD_PYTHON') ?: 'python')
        pip {
            install 'Flask==3.1.2'
            install 'cryptography==42.0.8'
            install 'httpx[http2]==0.28.1'
            install 'waitress==3.0.2'
            install 'tzdata==2025.2'
            install 'qrcode==8.2'
        }
    }
    sourceSets { main { srcDir '../../.build/android-python' } }
}
